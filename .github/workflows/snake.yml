name: contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff2bd6&color_dots=#161b22,#0f3b3a,#16605d,#00a8bb,#00e5ff
            dist/snake-light.svg?color_snake=#c2187e&color_dots=#ebedf0,#b3e9f2,#5fcfe0,#0aa8bf,#0077b6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
